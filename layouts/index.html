{{ define "main" }}

<header class="h-card">
    <img class="u-photo site-photo" src="/images/stille.webp" alt="Daniel" width="96" height="96">
    <h1>Hi, I'm <span class="p-name">Daniel</span></h1>
    <data class="u-url u-uid" value="{{ $.Site.BaseURL }}"></data>
    {{- if $.Site.Params.theme_config.show_description -}}
        <p class="p-note">{{ $.Site.Params.description }}</p>
    {{- end -}}
</header>
{{ .Content }}
{{ partial "menu_item.html" (dict "context" . "collection" hugo.Data.menu.entries) }}

{{ end }}
