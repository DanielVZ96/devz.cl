{{ define "main" }}

<article class="h-entry">
    <h1 class="p-name">{{ .Title }}</h1>

    <a class="u-url microformats-meta" href="{{ .Permalink }}">
        Published <time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}</time>
    </a>
    <a class="u-author microformats-meta" rel="author" href="{{ .Site.BaseURL }}">Daniel</a>

    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }} class="toc" {{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    <div class="e-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
